# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - sotr-frontend-web

on:
  push:
    branches:
      - clean-main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: "20.x"

      - name: Install + build (frontend)
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Prepare deploy folder (server + build)
        run: |
          rm -rf deploy
          mkdir -p deploy/build
          cp -r frontend/build/* deploy/build/
          cp server.js deploy/server.js
          cp package.json deploy/package.json

      - name: Install production deps (so express exists)
        working-directory: deploy
        run: |
          npm install --omit=dev

      - name: Zip deploy package
        working-directory: deploy
        run: |
          zip -r ../site.zip .

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: site.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: site

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: "sotr-frontend-web"
          slot-name: "Production"
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_15306AB08EE24FCEB29266DFB45F0092 }}
          package: site.zip
