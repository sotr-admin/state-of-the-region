name: Build and deploy React app to Azure Web App - sotr-frontend-web

on:
  push:
    branches:
      - clean-main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install and build frontend
        working-directory: frontend
        env:
          REACT_APP_API_BASE_URL: "https://mumasotrprodwa-erhxhycngfc5gsfw.eastus-01.azurewebsites.net"
        run: |
          npm ci
          npm run build

      - name: Prepare deploy folder (STATIC ONLY)
        run: |
          rm -rf deploy
          mkdir -p deploy
          cp -r frontend/build/* deploy/

          # Add a tiny version file so you can verify what's live
          echo "commit=${GITHUB_SHA}" > deploy/version.txt
          echo "built_at_utc=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> deploy/version.txt

      - name: Zip deploy package
        run: |
          cd deploy
          zip -r ../site.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: site.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: site

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: "sotr-frontend-web"
          slot-name: "Production"
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_SOTR_FRONTEND_WEB }}
          package: site.zip


